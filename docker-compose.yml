services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kaecs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaecs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaecs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kaecs}
    ports:
      - "5432:5432"
    volumes:
      - kaecs_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaecs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kaecs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kaecs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kaecs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kaecs_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kaecs_db_data:
  kaecs_redis_data:
  kaecs_minio_data:
